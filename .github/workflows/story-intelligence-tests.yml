name: Story Intelligence (offline)

on:
  pull_request:
    paths:
      - 'growthos/engine/story_intelligence/**'
      - 'growthos/engine/story_compile.py'
      - 'growthos/engine/script.py'
      - '.github/workflows/story-intelligence-tests.yml'
  push:
    branches:
      - 'feat/story-intelligence-pilot-v02'
    paths:
      - 'growthos/engine/story_intelligence/**'
      - 'growthos/engine/story_compile.py'
      - 'growthos/engine/script.py'
      - '.github/workflows/story-intelligence-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline tests (no secrets or paid APIs)
        env:
          ELEVENLABS_API_KEY: ''
        run: python -m unittest discover -s growthos/engine/story_intelligence -p 'test_*.py' -v
