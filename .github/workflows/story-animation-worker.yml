name: Story animation worker (dedicated, OFF by default)

# Renders animated Story Studio jobs apart from the main worker (growthos-worker.yml, which is not touched and still
# refuses animated stories because it never receives the flag). Nothing here runs on its own:
#   - no schedule, no push, no pull_request trigger (a PR must never get these secrets);
#   - manual dispatch only, and the job is skipped unless the repository variable STORY_ANIMATION_ENABLED is 'true';
#   - even then animation_worker.py exits at once when its own STORY_ANIMATION_ENABLED is off.
# Secrets are limited to what an animated job needs: no Pexels key, no cron secret, no site URL.
# Prerequisites that do NOT exist yet (see docs/product/STORY_STUDIO_ANIMATION_RUNBOOK_2026-10-24.md): the private
# `story-packs` bucket (growthos/supabase/pending/story_packs_bucket.sql) and a published, hashed pack.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: story-animation-worker
  cancel-in-progress: false

env:
  GODOT_VERSION: '4.7.2-stable'

jobs:
  animate:
    if: ${{ vars.STORY_ANIMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: growthos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growthos/requirements.txt

      - name: System packages (ffmpeg, virtual display, software OpenGL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb libgl1-mesa-dri libglu1-mesa libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64 || sudo apt-get install -y -qq ffmpeg xvfb libgl1-mesa-dri libglu1-mesa libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Download Godot and verify its SHA-512
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o sums.txt "${base}/SHA512-SUMS.txt"
          expected=$(grep "Godot_v${GODOT_VERSION}_linux.x86_64.zip" sums.txt | head -n1 | awk '{print $1}')
          actual=$(sha512sum godot.zip | awk '{print $1}')
          test -n "$expected" && test "$expected" = "$actual"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"

      - name: Fetch and verify the asset pack (private bucket, SHA-256 manifest)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORY_PACK_ID: ${{ vars.STORY_PACK_ID || 'prototype_v1' }}
        run: python -m engine.story_animation.cli fetch-pack --pack-id "$STORY_PACK_ID" --dest "$RUNNER_TEMP/story-pack"

      - name: Render the queued animated jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          STORY_ANIMATION_ENABLED: 'true'
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
          STORY_PACK_DIR: ${{ runner.temp }}/story-pack
          STORY_RENDER_LAUNCHER: 'xvfb-run -a -s "-screen 0 1280x2048x24"'
          STORY_RENDER_TIMEOUT_S: '900'
          ELEVENLABS_USD_PER_1K_CHARS: '0.18'
        run: python animation_worker.py --until-idle
