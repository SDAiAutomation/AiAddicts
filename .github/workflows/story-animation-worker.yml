name: Story animation worker (dedicated, OFF by default)

# Renders animated Story Studio jobs apart from the main worker (growthos-worker.yml, which is not touched and still
# refuses animated stories because it never receives the flag). Nothing here runs on its own:
#   - no schedule, no push, no pull_request trigger (a PR must never get these secrets);
#   - manual dispatch only, and the job is skipped unless the repository variable STORY_ANIMATION_ENABLED is 'true';
#   - even then animation_worker.py exits at once when its own STORY_ANIMATION_ENABLED is off.
# Secrets are limited to what an animated job needs: no Pexels key, no cron secret, no site URL.
# Prerequisites that do NOT exist yet (see docs/product/STORY_STUDIO_ANIMATION_RUNBOOK_2026-10-24.md): the private
# `story-packs` bucket (growthos/supabase/pending/story_packs_bucket.sql) and a published, hashed pack.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: story-animation-worker
  cancel-in-progress: false

env:
  GODOT_VERSION: '4.7.2-stable'

jobs:
  animate:
    if: ${{ vars.STORY_ANIMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A protected GitHub environment: configure "Required reviewers" on it (Settings > Environments > story-animation) so that a run waits
    # for a human approval, and move the secrets used below from the repository to that environment. Until then it behaves as before.
    environment: story-animation
    defaults:
      run:
        working-directory: growthos
    steps:
      # Third-party actions are pinned to a commit (a tag can be moved): update them deliberately, with review.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: growthos/requirements.txt

      - name: System packages (ffmpeg, virtual display, software OpenGL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb libgl1-mesa-dri libglu1-mesa libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64 || sudo apt-get install -y -qq ffmpeg xvfb libgl1-mesa-dri libglu1-mesa libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Download Godot and verify it against the SHA-512 pinned in this repository
        env:
          # Official value of Godot_v4.7.2-stable_linux.x86_64.zip (SHA512-SUMS.txt of the 4.7.2-stable release). The hash is NOT
          # downloaded next to the archive: a swapped archive would come with its own matching sum. Change version and hash together.
          GODOT_ZIP_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          actual=$(sha512sum godot.zip | awk '{print $1}')
          test -n "$GODOT_ZIP_SHA512" && test "$GODOT_ZIP_SHA512" = "$actual"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"

      - name: Fetch and verify the asset packs (private bucket, SHA-256 manifests)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for pack in prototype_v1 couleur_v1; do
            python -m engine.story_animation.cli fetch-pack --pack-id "$pack" --dest "$RUNNER_TEMP/story-packs/$pack"
          done

      - name: Isolate the renderer from the network (empty network namespace, no root) and prove it
        run: |
          launcher="sudo -E unshare -n setpriv --reuid=$(id -u) --regid=$(id -g) --clear-groups xvfb-run -a -s \"-screen 0 1280x2048x24\""
          echo "STORY_RENDER_LAUNCHER=${launcher}" >> "$GITHUB_ENV"
          # the same prefix must show no network and a non-root user, or the job stops before any secret-bearing step
          out=$(sudo unshare -n setpriv --reuid=$(id -u) --regid=$(id -g) --clear-groups python3 -c "import os,socket; s=socket.socket(); s.settimeout(3)
          try:
              s.connect(('1.1.1.1',53)); print('REACHABLE')
          except OSError:
              print('ISOLATED uid=%d' % os.getuid())")
          echo "$out"
          test "$out" = "ISOLATED uid=$(id -u)"

      - name: Render the queued animated jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          STORY_ANIMATION_ENABLED: 'true'
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
          STORY_PACK_DIR: ${{ runner.temp }}/story-packs
          STORY_RENDER_TIMEOUT_S: '900'
          ELEVENLABS_USD_PER_1K_CHARS: '0.18'
        run: python animation_worker.py --until-idle
