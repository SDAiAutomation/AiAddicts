name: Story animation offline spike

on:
  pull_request:
    paths:
      - "growthos/engine/story_animation_spike/**"
      - ".github/workflows/story-animation-offline-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic contract tests (no API keys)
        env:
          OPENAI_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: python -m unittest growthos.engine.story_animation_spike.test_timeline -v
