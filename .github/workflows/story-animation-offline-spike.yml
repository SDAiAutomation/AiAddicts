name: Story animation offline spike

on:
  pull_request:
    paths:
      - "growthos/engine/story_animation_spike/**"
      - ".github/workflows/story-animation-offline-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated rendering dependency
        run: python -m pip install "Pillow==12.0.0"
      - name: Check ffmpeg
        run: ffmpeg -version
      - name: Run deterministic offline tests
        env:
          OPENAI_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          python -m unittest growthos.engine.story_animation_spike.test_timeline -v
          python -m unittest growthos.engine.story_animation_spike.test_render_demo -v
