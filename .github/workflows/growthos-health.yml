name: GrowthOS health

# Toutes les heures : crédits OpenAI / ElevenLabs, connexions YouTube /
# TikTok, générations en échec ou file bloquée (growthos/check_providers.py).
# Un problème ouvre UN ticket GitHub (label alerte-faceloop, e-mail via la
# mention du propriétaire), mis à jour seulement si la liste des problèmes
# change, et fermé automatiquement quand tout revient à la normale.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: growthos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: growthos/requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Contrôler les fournisseurs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HEALTH_OPENAI_MODEL: "gpt-5-mini"
        run: python check_providers.py

      - name: Ouvrir, mettre à jour ou fermer le ticket d'alerte
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          label="alerte-faceloop"
          signature="$(cat health-signature.txt)"
          existing="$(gh issue list --label "$label" --state open --json number -q '.[0].number')"
          marker="<!-- signature: ${signature} -->"
          { cat health-report.md; echo; echo "@${OWNER}"; echo; echo "$marker"; } > issue-body.md

          if [ -n "$signature" ]; then
            if [ -z "$existing" ]; then
              gh label create "$label" --color d73a4a --description "Alerte automatique Faceloop" 2>/dev/null || true
              gh issue create --title "🚨 Faceloop : un fournisseur ou la génération est en panne" \
                --label "$label" --body-file issue-body.md
            elif ! gh issue view "$existing" --json body -q .body | grep -qF "$marker"; then
              gh issue edit "$existing" --body-file issue-body.md
              gh issue comment "$existing" --body-file issue-body.md
            else
              echo "Mêmes problèmes que le ticket #$existing : rien à renvoyer."
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --body "✅ Tout est revenu à la normale ($(date -u '+%Y-%m-%d %H:%M') UTC)."
            gh issue close "$existing"
          else
            echo "Aucun problème."
          fi
