name: Quiz chapter checks

on:
  pull_request:
    paths:
      - 'growthos/engine/quiz.py'
      - 'growthos/engine/quiz_motion.py'
      - 'growthos/tests/test_quiz.py'
      - 'growthos/tests/test_quiz_motion.py'
      - 'growthos/engine/quiz_chapter_export.py'
      - 'growthos/tests/test_quiz_chapter_export.py'
      - '.github/workflows/quiz-chapter-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiz-chapter-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine dependencies
        working-directory: growthos
        run: python -m pip install -r requirements.txt
      - name: Compile quiz modules
        working-directory: growthos
        run: python -m py_compile engine/quiz.py engine/quiz_motion.py
      - name: Run offline quiz regression tests
        working-directory: growthos
        run: python -m unittest discover -s tests -p 'test_quiz.py' -v && python -m unittest discover -s tests -p 'test_quiz_motion.py' -v && python -m unittest discover -s tests -p 'test_quiz_chapter_export.py' -v
