name: Story Animation contract (offline)

on:
  pull_request:
    paths:
      - 'growthos/engine/story_animation/**'
      - '.github/workflows/story-animation-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.2.0
      - name: Offline contract tests (no secrets, no paid APIs, no worker wiring)
        run: python -m unittest discover -s growthos/engine/story_animation -p 'test_*.py' -v
