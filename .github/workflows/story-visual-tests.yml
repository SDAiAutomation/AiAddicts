name: Story Visual (offline)

on:
  pull_request:
    paths:
      - 'growthos/engine/story_visual/**'
      - 'growthos/engine/openai_images.py'
      - 'growthos/engine/image_*.py'
      - '.github/workflows/story-visual-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies (Pillow, requests; ffmpeg is preinstalled on the runner)
        run: python -m pip install requests==2.34.2 Pillow==12.2.0
      - name: Offline tests (no secrets, doubles only, no paid API)
        env:
          OPENAI_API_KEY: ''
          ELEVENLABS_API_KEY: ''
        run: python -m unittest discover -s growthos/engine/story_visual -p 'test_*.py' -v
