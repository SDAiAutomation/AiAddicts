name: Subscriber Growth Intelligence tests

on:
  pull_request:
    paths:
      - "growthos/engine/subscriber_growth.py"
      - "growthos/tests/test_subscriber_growth.py"
      - ".github/workflows/subscriber-growth-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscriber-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test isolated subscriber growth module
        working-directory: growthos
        run: python -m unittest discover -s tests -p 'test_subscriber_growth.py' -v
