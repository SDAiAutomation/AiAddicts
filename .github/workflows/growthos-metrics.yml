name: GrowthOS metrics

# Relevé quotidien des métriques YouTube (vues, likes, commentaires, et
# rétention/partages/abonnés quand le compte a accordé yt-analytics.readonly)
# vers content_performance. La logique est dans growthos-web :
# /api/cron/youtube-metrics (src/lib/youtube/metrics.ts).
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  youtube-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relever les métriques YouTube
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          test -n "$CRON_SECRET" && test -n "$SITE_URL"
          SITE_URL="${SITE_URL%/}"
          # L'apex redirige vers www et la redirection perd le POST.
          if [ "$SITE_URL" = "https://faceloop.app" ]; then SITE_URL="https://www.faceloop.app"; fi
          http_code=$(curl --show-error --silent --output metrics-result.json --write-out '%{http_code}' \
            -X POST "$SITE_URL/api/cron/youtube-metrics" \
            -H "Authorization: Bearer $CRON_SECRET")
          cat metrics-result.json; echo
          if [ "$http_code" != "200" ]; then
            echo "Metrics cron returned HTTP $http_code; expected 200." >&2
            exit 1
          fi
