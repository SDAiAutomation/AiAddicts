name: GrowthOS worker

# Substitut de serveur worker permanent : GrowthOS n'a pas de VPS dédié, donc
# on vide la file de content_items ('queued' -> vidéo générée) par courtes
# passes planifiées, plutôt que de payer un process qui tourne en continu.
# `worker.py --until-idle` traite tout ce qui est en attente puis s'arrête
# dès que la file est vide (pas d'attente inutile quand il n'y a rien à
# faire) ; `timeout-minutes` sur le job reste le filet de sécurité si une
# génération individuelle restait bloquée.
#
# Limite connue de GitHub Actions : un schedule est automatiquement désactivé
# après 60 jours sans aucun commit sur le repo — un commit (même hors
# growthos/) le reconduit. Repo public -> minutes Actions illimitées,
# aucun coût lié à ce workflow.
#
# Note (2026-09-05) : le schedule n'a déclenché aucun run pendant les 2h
# suivant la création de ce fichier, alors que la branche par défaut venait
# d'être changée vers growthos/mvp juste avant — GitHub resynchronise son
# planificateur sur un commit vers la branche par défaut, mais le délai de
# reconnaissance peut dépasser 1h. Si ça se reproduit : déclencher
# manuellement (workflow_dispatch) en attendant, pousser un commit anodin
# ici pour forcer une resynchro.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # déclenchement manuel depuis l'onglet Actions, pour tester sans attendre

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: growthos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: growthos/requirements.txt

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Vider la file d'attente
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python worker.py --until-idle
