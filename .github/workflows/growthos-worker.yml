name: GrowthOS worker

# Substitut de serveur worker permanent : GrowthOS n'a pas de VPS dédié, donc
# on vide la file de content_items ('queued' -> vidéo générée) par courtes
# passes planifiées, plutôt que de payer un process qui tourne en continu.
# `worker.py --until-idle` traite tout ce qui est en attente puis s'arrête
# dès que la file est vide (pas d'attente inutile quand il n'y a rien à
# faire) ; `timeout-minutes` sur le job reste le filet de sécurité si une
# génération individuelle restait bloquée.
#
# Limite connue de GitHub Actions : un schedule est automatiquement désactivé
# après 60 jours sans aucun commit sur le repo — un commit (même hors
# growthos/) le reconduit. Repo public -> minutes Actions illimitées,
# aucun coût lié à ce workflow.
#
# Note (2026-09-05) : le schedule n'a déclenché aucun run pendant les 2h
# suivant la création de ce fichier, alors que la branche par défaut venait
# d'être changée vers growthos/mvp juste avant — GitHub resynchronise son
# planificateur sur un commit vers la branche par défaut, mais le délai de
# reconnaissance peut dépasser 1h. Si ça se reproduit : déclencher
# manuellement (workflow_dispatch) en attendant, pousser un commit anodin
# ici pour forcer une resynchro.

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {} # déclenchement manuel depuis l'onglet Actions, pour tester sans attendre

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: growthos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: growthos/requirements.txt

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Générer les épisodes de série dus (avant le worker vidéo)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          test -n "$CRON_SECRET" && test -n "$SITE_URL"
          SITE_URL="${SITE_URL%/}"
          if [ "$SITE_URL" = "https://faceloop.app" ]; then SITE_URL="https://www.faceloop.app"; fi
          http_code=$(curl --fail-with-body --show-error --silent --output series-result.json --write-out '%{http_code}' \
            -X POST "$SITE_URL/api/cron/series" \
            -H "Authorization: Bearer $CRON_SECRET")
          if [ "$http_code" != "200" ]; then
            echo "Series cron returned HTTP $http_code; expected 200 (check SITE_URL redirects)." >&2
            exit 1
          fi
          python - <<'PY'
          import json

          with open("series-result.json", encoding="utf-8") as result_file:
              result = json.load(result_file)
          failures = [row for row in result.get("results", []) if row.get("status") not in ("ok", "retry_scheduled", "déjà réclamé par un autre passage")]
          print(f"Series checked: {result.get('checked', 0)}, failed: {len(failures)}")
          for row in failures:
              print(f"{row.get('seriesId')}: {row.get('status')}")
          if failures:
              raise SystemExit(1)
          PY

      - name: Vider la file d'attente
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Tarifs pour le suivi de coût (generation_cost_report) : sans eux
          # le rapport reste à 0 $. À garder alignés avec growthos/.env.
          IMAGE_PRICE_TEXT_IN_PER_M: "5"
          IMAGE_PRICE_IMAGE_IN_PER_M: "8"
          IMAGE_PRICE_IMAGE_OUT_PER_M: "30"
          ELEVENLABS_USD_PER_1K_CHARS: "0.18"
          SCRIPT_PRICE_IN_PER_M: "0.25"
          SCRIPT_PRICE_OUT_PER_M: "2"
          # Diagnostic d'originalité (engine/originality.py) : bloque (revue)
          # à partir de 90, simple avertissement à partir de 70.
          ORIGINALITY_CHECK_ENABLED: "true"
          ORIGINALITY_MODEL: "gpt-5-mini"
          ORIGINALITY_PRICE_IN_PER_M: "0.25"
          ORIGINALITY_PRICE_OUT_PER_M: "2"
          # AutoEdit (expérimental) : analyse locale ffmpeg (coupures de plan +
          # pics audio), montages dans le bucket privé autoedit-results.
          AUTOEDIT_ENABLED: "true"
          AUTOEDIT_ANALYZER: "signals"
        run: python worker.py --until-idle

  publish-queue:
    needs: process-queue
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publier les vidéos terminées sur YouTube
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          test -n "$CRON_SECRET" && test -n "$SITE_URL"
          SITE_URL="${SITE_URL%/}"
          if [ "$SITE_URL" = "https://faceloop.app" ]; then SITE_URL="https://www.faceloop.app"; fi
          for attempt in 1 2 3; do
            curl --fail-with-body --show-error --silent \
              --output publication-result.json \
              -X POST "$SITE_URL/api/cron/auto-publish" \
              -H "Authorization: Bearer $CRON_SECRET"
            python - <<'PY'
          import json
          with open("publication-result.json", encoding="utf-8") as result_file:
              result = json.load(result_file)
          print(result)
          if result.get("processed") and not result.get("success"):
              print("YouTube publication failed; check the content page.")
          PY
            if python -c 'import json; print(json.load(open("publication-result.json", encoding="utf-8")).get("processed", False))' | grep -qx False; then
              break
            fi
          done
