<title>Le voyage d'un message</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 9:16 stage, transport bar, then the voice-over line the narrator would read */
:root{
  --ground:#070a13; --ink:#e9eefc; --dim:#8a93ad; --accent:#ff8a5b; --cyan:#49c6e5; --line:#1f2840;
  --disp:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --mono:"JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--disp);display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-block:14px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));box-sizing:border-box}
.col{width:min(100%, calc((100dvh - 210px) * 9 / 16));min-width:240px;max-width:100%;display:flex;flex-direction:column;gap:10px}
.stage{aspect-ratio:9/16;max-width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0a0f1c}
canvas{width:100%;height:100%;display:block}
.bar{display:flex;align-items:center;gap:8px}
button{font:700 13px var(--mono);color:#0a0f1c;background:var(--accent);border:0;border-radius:999px;padding:9px 13px;cursor:pointer;flex:none}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.time{font:500 12px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.vo{font-size:15px;line-height:1.45;color:var(--ink);min-height:3em;margin:0}
.vo b{font:700 11px var(--mono);letter-spacing:.12em;color:var(--dim);display:block;margin-bottom:2px}
</style>

<div class="col">
  <div class="stage"><canvas id="c" width="1080" height="1920" aria-label="Animation : le trajet d'un message à travers les sept couches du modèle OSI"></canvas></div>
  <div class="bar">
    <button id="play" type="button">Pause</button>
    <button id="snd" class="ghost" type="button" aria-pressed="false">Son</button>
    <input id="seek" type="range" min="0" max="58" step="0.01" value="0" aria-label="Position dans la vidéo">
    <span class="time" id="time">0:00</span>
  </div>
  <p class="vo" id="vo"><b>VOIX OFF</b><span id="voText"></span></p>
</div>

<script>
/* =====================================================================
   ENGINE — fixed library (would live in Faceloop, never written by the AI)
   ===================================================================== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1080,H=1920;
const C={bg:'#0a0f1c',panel:'#161f37',screen:'#0c1326',chip:'#18223b',ink:'#e9eefc',dim:'rgba(233,238,252,0.58)',line:'rgba(150,175,255,0.22)',dark:'#0a0f1c'};
const LC={7:'#ff8a5b',6:'#ffb547',5:'#e6d35e',4:'#6fd38a',3:'#49c6e5',2:'#7b93ff',1:'#b884ff'};
const DISP='"Bricolage Grotesque", "Inter", system-ui, sans-serif', MONO='"JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace';

const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const io=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const out=x=>1-Math.pow(1-clamp(x),3);
const inn=x=>Math.pow(clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const hash=(a,b=0)=>{let h=Math.imul((a|0)*374761393+(b|0)*668265263,1274126177);h^=h>>>13;h=Math.imul(h,1274126177);return((h^(h>>>16))>>>0)/4294967296};
/* keyframes: [[time, number|{...}, ease?]] — ease applies to the segment ending at that key */
function kf(t,keys,def=io){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){const [t1,v1,e]=keys[i],[t0,v0]=keys[i-1];
    if(t<=t1){const p=(e||def)(seg(t,t0,t1));if(typeof v0==='number')return lerp(v0,v1,p);const o={};for(const k in v0)o[k]=lerp(v0[k],v1[k],p);return o}}
  return keys[keys.length-1][1];
}
const camera=c=>ctx.setTransform(c.z,0,0,c.z,W/2-c.x*c.z,H/2-c.y*c.z);
const screen=()=>ctx.setTransform(1,0,0,1,0,0);
function T(s,x,y,o={}){
  const {size=40,weight=700,fam=DISP,color=C.ink,alpha=1,align='center',base='middle',ls=0,glow=0}=o;
  if(alpha<=0.002||!s)return;ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=color;
  ctx.font=`${weight} ${size}px ${fam}`;ctx.textAlign=align;ctx.textBaseline=base;
  if('letterSpacing' in ctx)ctx.letterSpacing=ls+'px';
  if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow}
  ctx.fillText(s,x,y);ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.min(r,h/2,w/2));else ctx.rect(x,y,w,h)}
function measure(s,size,weight=700,fam=DISP){ctx.save();ctx.font=`${weight} ${size}px ${fam}`;const w=ctx.measureText(s).width;ctx.restore();return w}
function background(cam){
  screen();ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  const z=cam?cam.z:1,step=64*clamp(0.55+z*0.45,0.8,3);
  const ox=cam?-cam.x*z*0.4:0,oy=cam?-cam.y*z*0.4:0;
  const sx=((ox%step)+step)%step,sy=((oy%step)+step)%step;
  ctx.fillStyle='rgba(150,175,255,0.09)';
  for(let x=sx;x<W;x+=step)for(let y=sy;y<H;y+=step)ctx.fillRect(x-1.5,y-1.5,3,3);
  const g=ctx.createRadialGradient(W/2,H*0.42,150,W/2,H*0.5,1250);
  g.addColorStop(0,'rgba(70,100,200,0.10)');g.addColorStop(1,'rgba(0,0,0,0.5)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function overlay(color,a){if(a<=0)return;screen();ctx.save();ctx.globalAlpha=clamp(a);ctx.fillStyle=color;ctx.fillRect(0,0,W,H);ctx.restore()}
/* a protocol block: x = left edge, y = centre */
function chunk(x,y,w,h,col,label,o={}){
  const a=o.alpha??1;if(a<=0.002)return;ctx.save();ctx.globalAlpha*=a;
  if(o.glow){ctx.shadowColor=col;ctx.shadowBlur=o.glow}
  ctx.fillStyle=col;rr(x,y-h/2,w,h,o.r??12);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x+10,y-h/2+5,w-20,2);
  ctx.restore();
  T(label,x+w/2,y+2,{size:o.size||24,weight:700,fam:o.fam||MONO,color:o.tc||C.dark,alpha:a});
}
/* a row of blocks; each item {w,col,label,p} slides in (p 0→1) or out (p 1→0) from its side */
function row(cx,cy,items,h){
  let total=-10;for(const it of items)total+=(it.w+10)*out(it.p);
  let x=cx-total/2;
  for(const it of items){if(it.p<=0.001)continue;const p=out(it.p);
    const off=(1-p)*(it.from==='right'?420:-420)+(it.dy?0:0);
    chunk(x+off,cy-(it.lift||0)*(1-p),it.w,h,it.col,it.label,{alpha:clamp(it.p*1.5),fam:it.fam,size:it.size,glow:it.glow});
    x+=(it.w+10)*p;}
}
function phone(cx,cy,o){
  const w=o.w||560,h=o.h||1100,x=cx-w/2,y=cy-h/2;
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=70;ctx.fillStyle=C.panel;rr(x,y,w,h,74);ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=3;rr(x,y,w,h,74);ctx.stroke();
  ctx.fillStyle=C.screen;rr(x+16,y+16,w-32,h-32,60);ctx.fill();
  ctx.fillStyle=C.panel;rr(cx-70,y+32,140,30,15);ctx.fill();
  const hy=y+130;ctx.fillStyle=o.avatar;ctx.beginPath();ctx.arc(x+82,hy,32,0,7);ctx.fill();
  T(o.contact[0],x+82,hy+2,{size:32,weight:800,color:C.dark});
  T(o.contact,x+130,hy-8,{size:36,weight:700,align:'left'});
  T(o.status||'en ligne',x+130,hy+26,{size:22,weight:500,align:'left',color:C.dim});
  ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(x+16,hy+60,w-32,2);
  const iy=y+h-108;ctx.fillStyle=C.chip;rr(x+40,iy-36,w-172,72,36);ctx.fill();
  T(o.input||'Message',x+72,iy+1,{size:30,weight:500,align:'left',color:o.input?C.ink:'rgba(233,238,252,0.35)'});
  const s=1+(o.press||0)*0.22;ctx.save();ctx.translate(x+w-82,iy);ctx.scale(s,s);
  ctx.fillStyle=LC[7];ctx.beginPath();ctx.arc(0,0,38,0,7);ctx.fill();
  ctx.fillStyle=C.dark;ctx.beginPath();ctx.moveTo(-13,-16);ctx.lineTo(19,0);ctx.lineTo(-13,16);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();ctx.restore();
  for(const b of o.bubbles||[])bubble(b);
}
function bubble({edge,y,text,side,alpha=1,col,tc=C.dark,s=1}){
  if(alpha<=0.002)return;const w=measure(text,34,600)+64,h=88,x=side==='right'?edge-w:edge;
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x+w/2,y);ctx.scale(s,s);
  ctx.fillStyle=col;rr(-w/2,-h/2,w,h,34);ctx.fill();ctx.restore();
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x+w/2,y);ctx.scale(s,s);T(text,0,2,{size:34,weight:600,color:tc});ctx.restore();
}
function miniPhone(x,y,label,glow=0){
  ctx.save();if(glow){ctx.shadowColor=LC[3];ctx.shadowBlur=60*glow}
  ctx.fillStyle=C.panel;rr(x-62,y-112,124,224,26);ctx.fill();ctx.restore();
  ctx.fillStyle=C.screen;rr(x-52,y-100,104,200,18);ctx.fill();
  ctx.fillStyle=LC[7];rr(x-30,y-30,70,28,12);ctx.fill();
  T(label,x,y+150,{size:28,weight:700,color:C.dim});
}
function antenna(x,y,act=0,t=0){
  ctx.save();ctx.strokeStyle='rgba(233,238,252,0.75)';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y-90);ctx.lineTo(x-42,y+70);ctx.moveTo(x,y-90);ctx.lineTo(x+42,y+70);
  ctx.moveTo(x-28,y+18);ctx.lineTo(x+28,y+18);ctx.moveTo(x-16,y-30);ctx.lineTo(x+16,y-30);ctx.stroke();
  ctx.fillStyle=LC[1];ctx.beginPath();ctx.arc(x,y-96,11,0,7);ctx.fill();
  if(act>0){ctx.strokeStyle=LC[1];ctx.lineWidth=4;for(let k=0;k<3;k++){const r=((t*1.6+k/3)%1);ctx.globalAlpha=act*(1-r);
    ctx.beginPath();ctx.arc(x,y-96,24+r*90,-2.4,-0.74);ctx.stroke();}}
  ctx.restore();
}
function router(x,y,hot=0){
  ctx.save();ctx.shadowColor=LC[3];ctx.shadowBlur=40*hot;ctx.fillStyle='#101a30';ctx.beginPath();ctx.arc(x,y,44,0,7);ctx.fill();ctx.restore();
  ctx.strokeStyle=hot>0?LC[3]:'rgba(73,198,229,0.55)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,44,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(233,238,252,0.8)';ctx.lineWidth=4;ctx.lineCap='round';
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ctx.beginPath();ctx.moveTo(x+dx*8,y+dy*8);ctx.lineTo(x+dx*24,y+dy*24);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+dx*24+dy*7,y+dy*24-dx*7);ctx.lineTo(x+dx*30,y+dy*30);ctx.lineTo(x+dx*24-dy*7,y+dy*24+dx*7);ctx.stroke();}
}
function polyPos(pts,p){
  let L=0;const d=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);d.push(l);L+=l}
  let s=clamp(p)*L;for(let i=0;i<d.length;i++){if(s<=d[i]){const q=s/d[i];return[lerp(pts[i][0],pts[i+1][0],q),lerp(pts[i][1],pts[i+1][1],q)]}s-=d[i]}
  return pts[pts.length-1];
}
function pill(s,x,y,col,a){
  if(a<=0.002)return;const w=measure(s,36,700)+70;ctx.save();ctx.globalAlpha*=a;
  ctx.fillStyle='rgba(16,24,44,0.9)';rr(x-w/2,y-38,w,76,38);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=3;rr(x-w/2,y-38,w,76,38);ctx.stroke();ctx.restore();
  T(s,x,y+2,{size:36,weight:700,alpha:a});
}
function lock(x,y,s,a){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.scale(s,s);
  ctx.strokeStyle=LC[6];ctx.lineWidth=9;ctx.beginPath();ctx.arc(0,-14,22,Math.PI,0);ctx.lineTo(22,4);ctx.moveTo(-22,4);ctx.lineTo(-22,-14);ctx.stroke();
  ctx.fillStyle=LC[6];rr(-34,0,68,52,10);ctx.fill();ctx.fillStyle=C.dark;ctx.beginPath();ctx.arc(0,22,8,0,7);ctx.fill();ctx.restore();
}

/* sound design: one synth, used live (AudioContext) and offline (OfflineAudioContext for the MP4) */
const NOISE=new WeakMap();
function noise(ac){if(NOISE.has(ac))return NOISE.get(ac);const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=hash(i,7)*2-1;NOISE.set(ac,b);return b}
function env(ac,dest,when,peak,att,dec){const g=ac.createGain();g.gain.setValueAtTime(0.0001,when);g.gain.exponentialRampToValueAtTime(peak,when+att);g.gain.exponentialRampToValueAtTime(0.0001,when+att+dec);g.connect(dest);return g}
function tone(ac,dest,when,type,f0,f1,dur,peak){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,when);o.frequency.exponentialRampToValueAtTime(f1,when+dur);
  o.connect(env(ac,dest,when,peak,0.005,dur));o.start(when);o.stop(when+dur+0.05)}
function burst(ac,dest,when,dur,peak,type,f0,f1,q=1){const s=ac.createBufferSource();s.buffer=noise(ac);const f=ac.createBiquadFilter();f.type=type;f.Q.value=q;
  f.frequency.setValueAtTime(f0,when);f.frequency.exponentialRampToValueAtTime(f1,when+dur);s.connect(f);f.connect(env(ac,dest,when,peak,dur*0.35,dur*0.65));s.start(when,hash(when*1000|0)*0.5);s.stop(when+dur+0.05)}
function sfx(ac,dest,when,type,k=0){
  switch(type){
    case 'tick':burst(ac,dest,when,0.03,0.12,'highpass',3500,4500);break;
    case 'pop':tone(ac,dest,when,'sine',620,300,0.14,0.35);break;
    case 'clip':tone(ac,dest,when,'square',1150,1100,0.03,0.07);tone(ac,dest,when+0.045,'square',1600,1550,0.03,0.07);break;
    case 'unclip':tone(ac,dest,when,'square',1600,1550,0.03,0.07);tone(ac,dest,when+0.045,'square',1050,1000,0.03,0.07);break;
    case 'whoosh':burst(ac,dest,when,0.7,0.32,'bandpass',300,3200,0.9);break;
    case 'whooshDown':burst(ac,dest,when,0.5,0.22,'bandpass',2400,400,1.2);break;
    case 'drop':tone(ac,dest,when,'sine',240,110,0.18,0.3);break;
    case 'impact':tone(ac,dest,when,'sine',130,45,0.5,0.7);burst(ac,dest,when,0.25,0.25,'lowpass',2000,300);break;
    case 'glitch':for(let i=0;i<8;i++)tone(ac,dest,when+i*0.045,'square',300+hash(i,k)*1500,300+hash(i,k+9)*1500,0.03,0.05);break;
    case 'split':[520,680,860].forEach((f,i)=>tone(ac,dest,when+i*0.07,'sine',f,f*0.8,0.1,0.25));break;
    case 'bits':for(let i=0;i<14;i++)tone(ac,dest,when+i*0.035,'square',900+hash(i,k)*1600,900+hash(i,k)*1600,0.018,0.04);break;
    case 'blip':tone(ac,dest,when,'sine',880+k*120,880+k*120,0.09,0.2);break;
    case 'scan':tone(ac,dest,when,'sawtooth',260,1300,0.55,0.05);break;
    case 'ping':tone(ac,dest,when,'sine',1320,1310,0.6,0.25);tone(ac,dest,when+0.09,'sine',1980,1970,0.5,0.16);break;
    case 'hit':sfx(ac,dest,when,'impact');tone(ac,dest,when+0.02,'triangle',440,440,1.2,0.12);tone(ac,dest,when+0.02,'triangle',660,660,1.2,0.08);break;
  }
}

/* =====================================================================
   TIMELINE — the part Claude writes for each video
   ===================================================================== */
const DUR=58,FPS=30;
const MSG='On mange ce soir ?',CIPH='x9#Fq@7%kL2!vR8&Zt';
const LN={7:'APPLICATION',6:'PRÉSENTATION',5:'SESSION',4:'TRANSPORT',3:'RÉSEAU',2:'LIAISON',1:'PHYSIQUE'};
const NARRATION=[
 [0.0,'Tu appuies sur « Envoyer ».'],
 [2.2,'En une fraction de seconde, ton message va traverser sept couches… et des centaines de kilomètres.'],
 [6.0,'Couche 7, Application : ton appli prépare le message.'],
 [9.0,'Couche 6, Présentation : il est chiffré. Personne en chemin ne peut le lire.'],
 [12.5,'Couche 5, Session : la conversation reste ouverte entre les deux téléphones.'],
 [15.5,'Couche 4, Transport : le message est découpé en morceaux, numérotés pour être remis dans l’ordre.'],
 [20.0,'Couche 3, Réseau : chaque morceau reçoit l’adresse IP de départ et d’arrivée.'],
 [24.0,'Couche 2, Liaison : on ajoute l’adresse du prochain appareil sur la route.'],
 [27.5,'Couche 1, Physique : tout devient des 0 et des 1, envoyés par ondes radio.'],
 [31.0,'Direction l’antenne, puis les routeurs d’Internet.'],
 [34.5,'Chaque routeur ne lit que l’adresse IP, et choisit par où envoyer le morceau.'],
 [38.5,'Les morceaux ne prennent pas forcément la même route.'],
 [42.5,'À l’arrivée, le téléphone fait le chemin inverse : il retire chaque couche.'],
 [47.0,'Il remet les morceaux dans l’ordre, déchiffre…'],
 [50.5,'… et le message s’affiche.'],
 [53.0,'Sept couches, à l’aller comme au retour, en un clin d’œil.'],
];
const fy=L=>(7-L)*300, PX=20;
const piece=n=>CIPH.slice((n-1)*6,n*6);
function scramble(src,dst,p,l,k){ // progressively turns src into dst with flickering glyphs
  const G='#%&@$*+=?!<>0123456789ABCDEFxzq';let s='';const n=src.length;
  for(let i=0;i<n;i++){const c=i/n;if(p>=1||p>c+0.18)s+=dst[i];else if(p>c)s+=G[Math.floor(hash(i,Math.floor(l*16)+k)*G.length)];else s+=src[i]}
  return s;
}
function layerHud(l,sched,roles,eyebrow){
  screen();const g=ctx.createLinearGradient(0,0,0,640);g.addColorStop(0,'rgba(10,15,28,0.96)');g.addColorStop(0.7,'rgba(10,15,28,0.75)');g.addColorStop(1,'rgba(10,15,28,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,640);

  for(let i=0;i<sched.length;i++){const [L,e]=sched[i],ne=i+1<sched.length?sched[i+1][1]:999;
    const a=out(seg(l,e,e+0.45))*(1-seg(l,ne-0.45,ne-0.05));if(a<=0)continue;const dy=(1-a)*36;
    T(String(L),66,330+dy,{size:250,weight:800,color:LC[L],align:'left',alpha:a,glow:30});
    T(LN[L],250,282+dy,{size:72,weight:800,align:'left',alpha:a,ls:-1});

  let cur=sched[0][0];for(const [L,e] of sched)if(l>=e)cur=L;
  for(let L=7;L>=1;L--){const y=600+(7-L)*120,on=L===cur;

    if(on){ctx.strokeStyle=LC[L];ctx.lineWidth=3;ctx.beginPath();ctx.arc(1024,y,26,0,7);ctx.stroke()}}
}
function floors(cur,camX){
  for(let L=7;L>=1;L--){const y=fy(L),a=L===cur?1:0.42;

    for(let k=0;k<4;k++){const r=((l*0.9+k/4)%1)*330;ctx.globalAlpha=wa*(1-r/330);ctx.beginPath();ctx.arc(ax,ay-80,r,ang-0.45,ang+0.45);ctx.stroke()}ctx.restore();}

    for(let k=6;k>=1;k--){const [x,y]=polyPos(P,p-k*0.012);ctx.globalAlpha=0.35*(1-k/7);ctx.fillStyle=LC[3];ctx.beginPath();ctx.arc(x,y,14-k,0,7);ctx.fill()}

  // router reads only the IP header
  const ca=out(seg(l,4.7,5.1))*(1-seg(l,6.9,7.3));

    const sc=0.6;ctx.save();ctx.translate(cx0,cyc+18);ctx.scale(sc,sc);

  for(let r=0;r<3;r++){add(42.5+2.05+r*0.1,'unclip');add(42.5+3.2+r*0.1,'unclip');add(42.5+5.05+r*0.08,'unclip')}

  const sr=48000,ac=new OfflineAudioContext(2,Math.ceil(sr*DUR),sr),comp=ac.createDynamicsCompressor(),m=ac.createGain();m.gain.value=0.9;m.connect(comp);comp.connect(ac.destination);
  for(const e of SFX)sfx(ac,m,e.at+0.001,e.type,e.k);
  const buf=await ac.startRendering(),L=buf.getChannelData(0),R=buf.getChannelData(1),n=L.length,dv=new DataView(new ArrayBuffer(44+n*4));
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  for(let i=0;i<n;i++){dv.setInt16(44+i*4,clamp(L[i],-1,1)*32767,true);dv.setInt16(46+i*4,clamp(R[i],-1,1)*32767,true)}
  const bytes=new Uint8Array(dv.buffer);let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+32768));return btoa(s);
};

/* =====================================================================
   PLAYER (preview only — the MP4 render calls renderAt(t) frame by frame)
   ===================================================================== */
const playBtn=document.getElementById('play'),sndBtn=document.getElementById('snd'),seek=document.getElementById('seek'),timeEl=document.getElementById('time'),voText=document.getElementById('voText');
let t=0,prev=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=null,ac=null,master=null,stopped=false;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function voAt(t){let s='';for(const [at,line] of NARRATION)if(t>=at)s=line;return s}
function ui(){seek.value=t;timeEl.textContent=fmt(t)+' / '+fmt(DUR);playBtn.textContent=playing?'Pause':(t>=DUR?'Rejouer':'Lecture');const v=voAt(t);if(voText.textContent!==v)voText.textContent=v}
function loop(now){
  if(stopped)return;
  if(playing){if(last!==null)t=Math.min(DUR,t+(now-last)/1000);last=now;if(t>=DUR)playing=false;
    if(ac&&ac.state==='running')for(const e of SFX)if(e.at>prev&&e.at<=t)sfx(ac,master,ac.currentTime+0.01,e.type,e.k);}
  else last=null;
  prev=t;renderAt(t);ui();requestAnimationFrame(loop);
}
playBtn.onclick=()=>{if(t>=DUR){t=0;prev=0}playing=!playing;};
sndBtn.onclick=()=>{try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.8;master.connect(ac.destination)}
  const on=sndBtn.getAttribute('aria-pressed')!=='true';sndBtn.setAttribute('aria-pressed',String(on));if(on)ac.resume();else ac.suspend();}catch(e){}};
seek.oninput=()=>{t=+seek.value;prev=t;};
window.__stop=()=>{stopped=true};
renderAt(1.2);ui();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
</script>
